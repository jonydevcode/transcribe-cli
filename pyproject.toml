[project]
name = "transcribe-cli"
version = "0.1.0"
description = "Local audio and video transcription CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "huggingface-hub>=1.9.1",
    "librosa>=0.11.0",
    "protobuf>=7.34.1",
    "sentencepiece>=0.2.1",
    "soundfile>=0.13.1",
    "torch>=2.10.0",
    "transformers>=5.4.0,<6",
    "triton-rocm; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
triton-rocm = { index = "pytorch-rocm", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
